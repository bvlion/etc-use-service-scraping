name: scraping

on:
  workflow_dispatch:

jobs:
  diagnose-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe HTTP from runner
        run: bash .github/probe-login.sh
      - name: Build current Intel image
        run: docker build -q -t etc-login-probe -f Intel/Dockerfile .
      - name: Probe HTTP and Chrome from container
        run: |
          docker run --rm -v "$PWD/.github:/probe:ro" etc-login-probe bash /probe/probe-login.sh
          docker run --rm -v "$PWD/.github:/probe:ro" etc-login-probe bundle exec ruby /probe/probe-login.rb
